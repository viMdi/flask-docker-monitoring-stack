services:
  psqldatabases:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: ghcr.io/vimdi/flask_hlab:latest
    ports:
      - "127.0.0.1:5000:5000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - psqldatabases
    environment:
      DB_HOST: psqldatabases
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}

  worker:
    image: ghcr.io/vimdi/flask_hlab:latest
    command: ["python", "-u", "checker.py"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - psqldatabases
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST: psqldatabases
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}


  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  pgdata:
