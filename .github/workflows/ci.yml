name: Docker build CI


on:
  push:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: build and push doc image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/vimdi/flask_hlab:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/qoqo1/projects/flask-docker-monitoring-stack
            git pull
            echo "${{ secrets.GHRC_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull web
            docker compose up -d
