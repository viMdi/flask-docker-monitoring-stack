<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UptimeGuard{% endblock %}</title>
    <style>
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --text: #000000;
            --text-muted: #666666;
            --border: #eaeaea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 14px; margin-left: 24px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text); }
        main { flex: 1; }
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">🛡️ UptimeGuard</a>
        <div class="nav-links">
            <a href="#">Тарифы</a>
            <a href="#">Документация</a>
            <a href="/dashboard" class="btn" style="padding: 8px 16px;">Войти</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 UptimeGuard. Мониторинг доступности сайтов для бизнеса.
    </footer>
</body>
</html>
